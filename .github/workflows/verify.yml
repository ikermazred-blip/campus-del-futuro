name: Verify SCHOOL AI WORLD
on:
  push:
    branches:
      - main
      - feature/school-ai-world-complete
      - fix/school-ai-world-preview
      - feature/subject-characters-main-agenda
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Tests
        run: bun run test
